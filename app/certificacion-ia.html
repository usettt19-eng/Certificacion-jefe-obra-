<style>
/* Layout: cuaderno de obra. Barra con cinta de balizamiento, vistas Inicio → Módulo → Reto → Certificado, columna única de lectura. */
:root {
  --bg: #e9eceb; --surface: #f7f8f7; --sunk: #dfe3e2; --ink: #1a2124; --muted: #56626a; --line: #cdd3d3;
  --accent: #d75f0a; --accent-ink: #ffffff; --accent-soft: #fbe6d6; --steel: #285b77; --steel-soft: #dbe8ef;
  --good: #2f7a3e; --good-soft: #dcefdf; --bad: #b3261e; --bad-soft: #f6dcda; --tape-a: #f2b41b; --tape-b: #1a2124;
  --f-display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121719; --surface: #1a2023; --sunk: #0d1113; --ink: #e5e9ea; --muted: #97a3a9; --line: #2c363a;
  --accent: #f0883a; --accent-ink: #1a1007; --accent-soft: #3a2414; --steel: #86b6d1; --steel-soft: #1b2c36;
  --good: #79c78a; --good-soft: #17301d; --bad: #ef8a83; --bad-soft: #3a1a18; --tape-a: #e0a514; --tape-b: #121719;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121719; --surface: #1a2023; --sunk: #0d1113; --ink: #e5e9ea; --muted: #97a3a9; --line: #2c363a;
  --accent: #f0883a; --accent-ink: #1a1007; --accent-soft: #3a2414; --steel: #86b6d1; --steel-soft: #1b2c36;
  --good: #79c78a; --good-soft: #17301d; --bad: #ef8a83; --bad-soft: #3a1a18; --tape-a: #e0a514; --tape-b: #121719;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 85%; line-height: 1.15; margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ink); color: var(--bg); }
.bar-in { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--f-display); font-weight: 800; font-stretch: 75%; font-size: 19px; letter-spacing: .02em; text-transform: uppercase; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; }
.brand span { color: var(--tape-a); }
.bar-stats { margin-left: auto; display: flex; gap: 8px; font-family: var(--f-mono); font-size: 12px; }
.bar-stats b { color: var(--tape-a); font-weight: 500; }
.tape { height: 8px; background: repeating-linear-gradient(-45deg, var(--tape-a) 0 12px, var(--tape-b) 12px 24px); }

main { max-width: 860px; margin: 0 auto; padding-block: 22px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px; }

.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--muted); max-width: 62ch; margin: 6px 0 0; }
.hero h1 { font-size: clamp(28px, 6vw, 44px); font-weight: 800; margin-top: 6px; }
.hero h1 em { font-style: normal; color: var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.panel h2 { font-size: 20px; font-weight: 700; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 200px; min-width: 0; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
input[type=text], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; width: 100%; }
textarea { min-height: 180px; resize: vertical; font-family: var(--f-mono); font-size: 13.5px; line-height: 1.5; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 9px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.steel { background: var(--steel); border-color: var(--steel); color: var(--surface); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.link { border: 0; background: none; padding: 0; color: var(--steel); text-decoration: underline; font-weight: 500; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

.method { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 12px; }
.method div { border-top: 3px solid var(--steel); background: var(--bg); padding: 8px 10px; border-radius: 0 0 6px 6px; font-size: 13px; }
.method b { display: block; font-family: var(--f-display); font-stretch: 80%; font-size: 15px; letter-spacing: .03em; text-transform: uppercase; }

.mods { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.mod { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
.mod:hover { border-color: var(--accent); }
.mod .code { font-family: var(--f-mono); font-size: 12px; color: var(--accent); }
.mod h3 { font-size: 18px; font-weight: 700; }
.mod p { margin: 0; font-size: 13.5px; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.chip { font-family: var(--f-mono); font-size: 11.5px; border-radius: 4px; padding: 2px 7px; background: var(--sunk); color: var(--muted); }
.chip.ok { background: var(--good-soft); color: var(--good); }
.chip.ko { background: var(--bad-soft); color: var(--bad); }
.chip.skill { background: var(--steel-soft); color: var(--steel); }

.tips { margin: 10px 0 0; padding-left: 18px; }
.tips li { margin-bottom: 6px; }
.retos { display: flex; flex-direction: column; gap: 10px; }
.reto-item { display: flex; gap: 14px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.reto-item:hover { border-color: var(--accent); }
.reto-item .code { font-family: var(--f-mono); font-weight: 500; color: var(--accent); min-width: 34px; }
.reto-item .t { flex: 1; min-width: 0; }
.reto-item .t b { display: block; }
.reto-item .t span { font-size: 13px; color: var(--muted); }
.nota { font-family: var(--f-mono); font-size: 18px; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }

.case { white-space: pre-wrap; font-family: var(--f-mono); font-size: 12.8px; background: var(--sunk); border-radius: 6px; padding: 12px; overflow-x: auto; margin: 10px 0 0; }
.task { border-left: 4px solid var(--accent); padding: 8px 12px; background: var(--accent-soft); border-radius: 0 6px 6px 0; margin-top: 12px; }
.hint { font-size: 12.5px; color: var(--muted); }
.out { margin-top: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; overflow-x: auto; max-height: 520px; overflow-y: auto; }
.out table { border-collapse: collapse; font-size: 13px; }
.out th, .out td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
.out pre { white-space: pre-wrap; }
.out p:first-child { margin-top: 0; }
.status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }

.score { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.score .big { font-family: var(--f-display); font-weight: 800; font-size: 54px; font-stretch: 75%; line-height: 1; font-variant-numeric: tabular-nums; }
.stamp { font-family: var(--f-display); font-weight: 800; font-stretch: 70%; letter-spacing: .12em; border: 3px solid currentColor; padding: 2px 10px; border-radius: 4px; transform: rotate(-4deg); font-size: 20px; }
.stamp.ok { color: var(--good); } .stamp.ko { color: var(--bad); }
.crit { display: grid; grid-template-columns: minmax(110px, 160px) 1fr 34px; gap: 6px 10px; align-items: center; margin-top: 14px; font-size: 13.5px; }
.meter { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--steel); }
.crit .v { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.matrix { display: grid; gap: 8px; margin-top: 14px; }
.matrix div { display: grid; grid-template-columns: 130px 1fr; gap: 10px; font-size: 13.5px; border-top: 1px solid var(--line); padding-top: 8px; }
.matrix b { font-family: var(--f-display); font-stretch: 85%; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 14px; }
.two h3 { font-size: 15px; }
.two ul { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; }

.notice { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; color: var(--muted); }
.notice.warn { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.reqs { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 6px; }
.reqs li::before { content: "○ "; color: var(--muted); }
.reqs li.ok::before { content: "● "; color: var(--good); }
.cert { border: 2px solid var(--ink); border-radius: 4px; padding: 22px; position: relative; background: var(--surface); }
.cert::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--line); pointer-events: none; }
.cert h2 { font-size: clamp(22px, 5vw, 32px); font-weight: 800; }
.cert .name { font-family: var(--f-display); font-size: clamp(22px, 5vw, 30px); font-weight: 700; color: var(--accent); margin: 10px 0 4px; }
.ctable { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
.ctable td { border-top: 1px solid var(--line); padding: 5px 4px; }
.ctable td:last-child { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.crumbs { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; }
.foot { font-size: 12px; color: var(--muted); }
</style>

<header class="bar">
  <div class="bar-in">
    <button class="brand" data-go="inicio" type="button">Certificación <span>IA</span> en Obra</button>
    <div class="bar-stats" id="barStats"></div>
  </div>
  <div class="tape"></div>
</header>
<main id="app"></main>

        datos: "Partida                          | Duración restante | Precede a                | Recursos actuales\nForjados P4, P5 y cubierta       | 18 días           | Fachada, cubierta        | 1 cuadrilla encofrado (6 op.)\nCerramiento de fachada (ladrillo)| 25 días           | Carpintería exterior     | 2 cuadrillas\nTabiquería PB-P3                 | 20 días           | Instalaciones            | 1 cuadrilla\nInstalaciones (fontanería+elec.) | 30 días           | Acabados                 | 2 subcontratas\nCubierta e impermeabilización    | 10 días           | Acabados planta 5        | 1 subcontrata\n\nFin de obra contractual: 15 de diciembre. Grúa disponible hasta el 30 de octubre.\nRefuerzo posible: 2.ª cuadrilla de encofrado a 2.900 €/semana; sábados a +35 % de coste de mano de obra.",

    ] },
];
const RETOS = MODULOS.flatMap(m => m.retos.map(r => ({ ...r, modulo: m })));
const APTO_RETO = 60, APTO_MEDIA = 70;

// ---------- Estado ----------
const LS_KEY = "cert-ia-obra-v1";
let state = { nombre: "", nivel: "Jefe de Obra Junior", retos: {}, actualizado: 0 };
let view = { name: "inicio", modulo: null, reto: null };
let sample = null, sampleChecked = false;
let dbRef = null, dbStatus = "local";
const busy = { run: null, eval: null };
const live = { salida: "", evalText: "" };

function loadLocal() { try { const s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (s && s.retos) state = { ...state, ...s }; } catch (e) {} }
let saveTimer = null;
function save() {
  state.actualizado = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!dbRef) return;
    dbRef.set(JSON.parse(JSON.stringify(state))).then(() => { dbStatus = "cuenta"; renderBar(); })
      .catch(() => { dbRef = null; dbStatus = "local"; renderBar(); });
  }, 800);
}
function retoState(id) { return state.retos[id] || (state.retos[id] = { best: 0, intentos: 0, prompt: "", salida: "", eval: null }); }

function stats() {
  const notas = RETOS.map(r => (state.retos[r.id] && state.retos[r.id].best) || 0);
  const hechos = RETOS.filter(r => state.retos[r.id] && state.retos[r.id].intentos > 0).length;
  const aptos = notas.filter(n => n >= APTO_RETO).length;
  const media = Math.round(notas.reduce((a, b) => a + b, 0) / RETOS.length);
  return { notas, hechos, aptos, media, certificado: aptos === RETOS.length && media >= APTO_MEDIA };
}

// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function md(text) {
  try { if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text)); } catch (e) {}
  return "<pre>" + esc(text) + "</pre>";
}
const ERRORES = {
  not_granted: "No has permitido que esta página use Claude. Puedes activarlo desde el menú de permisos de la página.",

  session_expired: "Tu sesión ha caducado. Vuelve a iniciar sesión en Claude.",
  prompt_too_large: "El texto es demasiado largo. Recorta el prompt.",
  refused: "Claude no ha respondido a este prompt. Reformúlalo.",
  empty_completion: "Claude no ha devuelto texto. Simplifica el prompt.",
  invalid_json: "La evaluación no ha llegado en el formato esperado. Pulsa de nuevo «Evaluar».",
};
const errorText = e => ERRORES[e && e.code] || "No se ha podido completar la consulta. Inténtalo de nuevo.";
function nota(n) { return n >= APTO_RETO ? "ok" : "ko"; }

function codigo() {
  const base = state.nombre.trim().toLowerCase() + "|" + RETOS.map(r => (state.retos[r.id] || {}).best || 0).join(",");
  let h = 2166136261; for (const ch of base) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return "CIO-" + new Date().getFullYear() + "-" + (h >>> 0).toString(36).toUpperCase().padStart(6, "0").slice(0, 6);
}

// ---------- Interacción ----------
function bindInputs() {
  const n = $("#nombre"); if (n) n.addEventListener("input", () => { state.nombre = n.value; save(); });
  const l = $("#nivel"); if (l) l.addEventListener("change", () => { state.nivel = l.value; save(); });
  const p = $("#prompt"); if (p) p.addEventListener("input", () => { retoState(view.reto).prompt = p.value; save(); });
}

document.addEventListener("click", ev => {
  const go = ev.target.closest("[data-go]");
  if (go) {
    const g = go.dataset.go;
    view = { name: g, modulo: g === "modulo" ? Number(go.dataset.id) : view.modulo, reto: g === "reto" ? go.dataset.id : view.reto };
    if (g === "reto") view.modulo = RETOS.find(r => r.id === view.reto).modulo.id;
    render(); window.scrollTo(0, 0); return;
  }
  const act = ev.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;
  if (a === "insertar") insertarDatos();
  else if (a === "probar") probar();
  else if (a === "evaluar") evaluar();
  else if (a === "parar") { busy.run && busy.run.abort(); busy.eval && busy.eval.abort(); }
  else if (a === "usarMejorado") { const st = retoState(view.reto); st.prompt = st.eval.prompt_mejorado; save(); render(); }
  else if (a === "copiarMejorado") copiar(retoState(view.reto).eval.prompt_mejorado, act);
  else if (a === "descargar") descargar();
});

function insertarDatos() {
  const r = RETOS.find(x => x.id === view.reto), p = $("#prompt");
  const add = (p.value.trim() ? "\n\n" : "") + "Datos:\n" + r.datos;
  p.value += add; retoState(r.id).prompt = p.value; save(); p.focus();
}

function copiar(text, btn) {
  navigator.clipboard.writeText(text).then(() => { btn.textContent = "Copiado"; }).catch(() => { btn.textContent = "Selecciona el texto y cópialo"; });
}

function setStatus(html) { const s = $("#runStatus"); if (s) s.innerHTML = html; }

async function probar() {
  const id = view.reto, st = retoState(id), prompt = st.prompt.trim();
  if (!prompt) { setStatus(`<p class="hint">Escribe primero tu prompt.</p>`); return; }
  const ctl = new AbortController(); busy.run = ctl; live.salida = ""; render();
  try {
    const { text, truncated } = await sample(prompt, { signal: ctl.signal, cache: false, onText: ({ text }) => {
      live.salida = text; const o = $("#salida"); if (o && view.reto === id) o.innerHTML = md(text); } });
    st.salida = text.slice(0, 12000); save();
    busy.run = null; render();
    if (truncated) setStatus(`<p class="hint">La respuesta se ha cortado por longitud. Pide algo más acotado.</p>`);
  } catch (e) {
    if (e && e.text) st.salida = e.text;
    busy.run = null; render();
    if (!e || e.code !== "cancelled") setStatus(`<p class="hint" style="color:var(--bad)">${esc(errorText(e))}</p>`);
  }
}

function promptEvaluador(r, st) {
  return `Eres el evaluador de la certificación "Uso profesional de Claude en la Jefatura de Obra" (edificación y obra civil, España).
Un alumno de nivel "${state.nivel}" ha escrito el prompt que usaría con un asistente de IA para resolver un reto real de obra. Evalúa la calidad del PROMPT (no la de la respuesta de la IA) con esta rúbrica, de 0 a 5 por criterio. Ajusta la exigencia al nivel: más indulgente con Estudiante, más estricto con Senior.

- contexto: indica rol, tipo de obra y situación relevante.
- tarea: objetivo concreto y entregable claro.
- datos: incluye los datos del caso necesarios (cifras, hechos) sin omitir los críticos.
- formato: pide una salida usable en obra (tabla, correo, acta, lista, informe), con destinatario y extensión cuando proceda.
- criterio: incorpora criterio profesional del reto: ruta crítica y plazo, margen y contrato, PRL (protección colectiva antes que individual), normativa, y habilidades blandas cuando aplica (asertividad, empatía, liderazgo con respeto, aceptación de críticas, gestión del tiempo).
- control: pide supuestos explícitos o verificación de cálculos y normativa, deja la decisión final al jefe de obra y no expone datos personales innecesarios.

Añade la matriz de impacto: una frase sobre cómo el resultado que obtendría con este prompt afectaría al plazo, otra al aspecto económico y contractual, y otra a las habilidades blandas.

RETO ${r.id}: ${r.titulo}
Situación: ${r.situacion}
Datos disponibles del caso:
${r.datos}
Tarea encargada al alumno: ${r.tarea}

PROMPT DEL ALUMNO:
"""
${st.prompt.trim().slice(0, 8000)}
"""
${st.salida ? `\nRespuesta que obtuvo de la IA (solo como referencia, extracto):\n"""\n${st.salida.slice(0, 3000)}\n"""\n` : ""}
Responde SOLO con un objeto JSON, en español, con esta forma exacta:
{"criterios":{"contexto":0,"tarea":0,"datos":0,"formato":0,"criterio":0,"control":0},"impacto":{"plazo":"...","economico":"...","soft_skills":"..."},"fortalezas":["..."],"mejoras":["..."],"prompt_mejorado":"..."}
Máximo 3 fortalezas y 3 mejoras, concretas. El prompt_mejorado debe ser un prompt completo y realista que el alumno podría usar en obra.`;
}

async function evaluar() {
  const id = view.reto, r = RETOS.find(x => x.id === id), st = retoState(id);
  if (st.prompt.trim().length < 20) { setStatus(`<p class="hint">Escribe un prompt más completo antes de evaluarlo.</p>`); return; }
  const ctl = new AbortController(); busy.eval = ctl; render();
  try {
    const out = await sample.json(promptEvaluador(r, st), { signal: ctl.signal, cache: false });
    const c = (out && out.criterios) || {};
    const suma = CRITERIOS.reduce((a, [k]) => a + Math.max(0, Math.min(5, Number(c[k]) || 0)), 0);
    const n = Math.round(suma / 30 * 100);
    st.eval = {
      nota: n, criterios: c, impacto: out.impacto || {},
      fortalezas: Array.isArray(out.fortalezas) ? out.fortalezas.slice(0, 3).map(String) : [],
      mejoras: Array.isArray(out.mejoras) ? out.mejoras.slice(0, 3).map(String) : [],
      prompt_mejorado: typeof out.prompt_mejorado === "string" ? out.prompt_mejorado.slice(0, 6000) : "",
    };
    st.intentos += 1; st.best = Math.max(st.best, n); save();
    busy.eval = null; render();
    const box = $("#evalBox"); if (box) box.scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) {
    busy.eval = null; render();
    if (!e || e.code !== "cancelled") setStatus(`<p class="hint" style="color:var(--bad)">${esc(errorText(e))}</p>`);
  }
}

async function descargar() {
  const out = $("#dlStatus");
  const downloads = window.claude && await window.claude.use("downloads");
  if (!downloads || !window.jspdf) { out.textContent = "La descarga solo está disponible al abrir la página en claude.ai."; return; }
  const { jsPDF } = window.jspdf, s = stats();
  const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
  const W = 297, H = 210;
  doc.setFillColor(242, 180, 27); doc.rect(0, 0, W, 6, "F");
  for (let x = -10; x < W; x += 10) { doc.setFillColor(26, 33, 36); doc.triangle(x, 6, x + 5, 0, x + 10, 0, "F"); doc.triangle(x, 6, x + 5, 6, x + 10, 0, "F"); }
  doc.setDrawColor(26, 33, 36); doc.setLineWidth(0.8); doc.rect(12, 14, W - 24, H - 26);
  doc.setLineWidth(0.2); doc.rect(15, 17, W - 30, H - 32);
  doc.setTextColor(90, 98, 106); doc.setFont("helvetica", "normal"); doc.setFontSize(11);
  doc.text("CERTIFICADO DE FORMACIÓN", W / 2, 36, { align: "center" });
  doc.setTextColor(26, 33, 36); doc.setFont("helvetica", "bold"); doc.setFontSize(24);
  doc.text("Uso profesional de Claude en la Jefatura de Obra", W / 2, 50, { align: "center" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(12);
  doc.text("Se certifica que", W / 2, 64, { align: "center" });
  doc.setTextColor(215, 95, 10); doc.setFont("helvetica", "bold"); doc.setFontSize(28);
  doc.text(state.nombre.trim(), W / 2, 78, { align: "center" });
  doc.setTextColor(26, 33, 36); doc.setFont("helvetica", "normal"); doc.setFontSize(11);
  doc.text(`ha superado los 10 retos prácticos del programa (nivel: ${state.nivel}) con una nota media de ${s.media}/100.`, W / 2, 89, { align: "center" });
  let y = 104;
  doc.setFontSize(10);
  MODULOS.forEach(m => {
    const n = Math.round(m.retos.reduce((a, r) => a + ((state.retos[r.id] || {}).best || 0), 0) / m.retos.length);
    doc.text(`M${m.id} · ${m.titulo}`, 70, y); doc.text(String(n), W - 70, y, { align: "right" });
    doc.setDrawColor(205, 211, 211); doc.line(70, y + 2.5, W - 70, y + 2.5); y += 9;
  });
  doc.setFontSize(9); doc.setTextColor(90, 98, 106);
  const fecha = new Date().toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" });
  doc.text(`Fecha: ${fecha}    Código: ${codigo()}`, W / 2, H - 26, { align: "center" });
  doc.text("Certificación interna de formación. No sustituye titulaciones ni habilitaciones oficiales.", W / 2, H - 20, { align: "center" });
  try {
    await downloads.save({ filename: `Certificado-IA-Obra-${state.nombre.trim().replace(/\s+/g, "-")}.pdf`, data: doc.output("arraybuffer") });
    out.textContent = "Certificado descargado.";
  } catch (e) {
    out.textContent = e && e.code === "declined" ? "Has cancelado la descarga." : "No se ha podido descargar el certificado. Inténtalo de nuevo.";
  }
}

loadLocal();
render();
(async () => {
  if (!window.claude || !window.claude.use) { sampleChecked = true; render(); return; }
  claude.use("sample").then(s => { sample = s; sampleChecked = true; if (!busy.run && !busy.eval) render(); });
  try {
    const [user, db] = await Promise.all([claude.use("user"), claude.use("db")]);
    const uid = user && await user.id();
    if (db && uid) {
      const ref = db.doc("data/users/" + uid + "/progreso");
      const snap = await ref.get();
      const remote = snap.exists ? snap.data() : null;
      if (remote && remote.retos && (remote.actualizado || 0) > (state.actualizado || 0)) { state = { ...state, ...remote }; }
      dbRef = ref; dbStatus = "cuenta";
      if (!remote || (state.actualizado || 0) > (remote.actualizado || 0)) save();
      if (!busy.run && !busy.eval) render();
    }
  } catch (e) { dbRef = null; dbStatus = "local"; }
})();
