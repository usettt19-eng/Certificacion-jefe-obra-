<title>Claude para Jefes de Obra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cuaderno de obra. Barra con cinta de balizamiento, vistas Inicio → Módulo → Reto → Certificado, columna única de lectura. */
:root {
  --bg: #e9eceb; --surface: #f7f8f7; --sunk: #dfe3e2; --ink: #1a2124; --muted: #56626a; --line: #cdd3d3;
  --accent: #d75f0a; --accent-ink: #ffffff; --accent-soft: #fbe6d6; --steel: #285b77; --steel-soft: #dbe8ef;
  --good: #2f7a3e; --good-soft: #dcefdf; --bad: #b3261e; --bad-soft: #f6dcda; --tape-a: #f2b41b; --tape-b: #1a2124;
  --f-display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121719; --surface: #1a2023; --sunk: #0d1113; --ink: #e5e9ea; --muted: #97a3a9; --line: #2c363a;
  --accent: #f0883a; --accent-ink: #1a1007; --accent-soft: #3a2414; --steel: #86b6d1; --steel-soft: #1b2c36;
  --good: #79c78a; --good-soft: #17301d; --bad: #ef8a83; --bad-soft: #3a1a18; --tape-a: #e0a514; --tape-b: #121719;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121719; --surface: #1a2023; --sunk: #0d1113; --ink: #e5e9ea; --muted: #97a3a9; --line: #2c363a;
  --accent: #f0883a; --accent-ink: #1a1007; --accent-soft: #3a2414; --steel: #86b6d1; --steel-soft: #1b2c36;
  --good: #79c78a; --good-soft: #17301d; --bad: #ef8a83; --bad-soft: #3a1a18; --tape-a: #e0a514; --tape-b: #121719;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 85%; line-height: 1.15; margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ink); color: var(--bg); }
.bar-in { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--f-display); font-weight: 800; font-stretch: 75%; font-size: 19px; letter-spacing: .02em; text-transform: uppercase; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; }
.brand span { color: var(--tape-a); }
.bar-stats { margin-left: auto; display: flex; gap: 8px; font-family: var(--f-mono); font-size: 12px; }
.bar-stats b { color: var(--tape-a); font-weight: 500; }
.tape { height: 8px; background: repeating-linear-gradient(-45deg, var(--tape-a) 0 12px, var(--tape-b) 12px 24px); }

main { max-width: 860px; margin: 0 auto; padding-block: 22px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px; }

.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--muted); max-width: 62ch; margin: 6px 0 0; }
.hero h1 { font-size: clamp(28px, 6vw, 44px); font-weight: 800; margin-top: 6px; }
.hero h1 em { font-style: normal; color: var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.panel h2 { font-size: 20px; font-weight: 700; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 200px; min-width: 0; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
input[type=text], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; width: 100%; }
textarea { min-height: 180px; resize: vertical; font-family: var(--f-mono); font-size: 13.5px; line-height: 1.5; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 9px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.steel { background: var(--steel); border-color: var(--steel); color: var(--surface); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.link { border: 0; background: none; padding: 0; color: var(--steel); text-decoration: underline; font-weight: 500; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

.method { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 12px; }
.method div { border-top: 3px solid var(--steel); background: var(--bg); padding: 8px 10px; border-radius: 0 0 6px 6px; font-size: 13px; }
.method b { display: block; font-family: var(--f-display); font-stretch: 80%; font-size: 15px; letter-spacing: .03em; text-transform: uppercase; }

.mods { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.mod { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
.mod:hover { border-color: var(--accent); }
.mod .code { font-family: var(--f-mono); font-size: 12px; color: var(--accent); }
.mod h3 { font-size: 18px; font-weight: 700; }
.mod p { margin: 0; font-size: 13.5px; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.chip { font-family: var(--f-mono); font-size: 11.5px; border-radius: 4px; padding: 2px 7px; background: var(--sunk); color: var(--muted); }
.chip.ok { background: var(--good-soft); color: var(--good); }
.chip.ko { background: var(--bad-soft); color: var(--bad); }
.chip.skill { background: var(--steel-soft); color: var(--steel); }

.tips { margin: 10px 0 0; padding-left: 18px; }
.tips li { margin-bottom: 6px; }
.retos { display: flex; flex-direction: column; gap: 10px; }
.reto-item { display: flex; gap: 14px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.reto-item:hover { border-color: var(--accent); }
.reto-item .code { font-family: var(--f-mono); font-weight: 500; color: var(--accent); min-width: 34px; }
.reto-item .t { flex: 1; min-width: 0; }
.reto-item .t b { display: block; }
.reto-item .t span { font-size: 13px; color: var(--muted); }
.nota { font-family: var(--f-mono); font-size: 18px; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }

.case { white-space: pre-wrap; font-family: var(--f-mono); font-size: 12.8px; background: var(--sunk); border-radius: 6px; padding: 12px; overflow-x: auto; margin: 10px 0 0; }
.task { border-left: 4px solid var(--accent); padding: 8px 12px; background: var(--accent-soft); border-radius: 0 6px 6px 0; margin-top: 12px; }
.hint { font-size: 12.5px; color: var(--muted); }
.out { margin-top: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; overflow-x: auto; max-height: 520px; overflow-y: auto; }
.out table { border-collapse: collapse; font-size: 13px; }
.out th, .out td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
.out pre { white-space: pre-wrap; }
.out p:first-child { margin-top: 0; }
.status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }

.score { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.score .big { font-family: var(--f-display); font-weight: 800; font-size: 54px; font-stretch: 75%; line-height: 1; font-variant-numeric: tabular-nums; }
.stamp { font-family: var(--f-display); font-weight: 800; font-stretch: 70%; letter-spacing: .12em; border: 3px solid currentColor; padding: 2px 10px; border-radius: 4px; transform: rotate(-4deg); font-size: 20px; }
.stamp.ok { color: var(--good); } .stamp.ko { color: var(--bad); }
.crit { display: grid; grid-template-columns: minmax(110px, 160px) 1fr 34px; gap: 6px 10px; align-items: center; margin-top: 14px; font-size: 13.5px; }
.meter { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--steel); }
.crit .v { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.matrix { display: grid; gap: 8px; margin-top: 14px; }
.matrix div { display: grid; grid-template-columns: 130px 1fr; gap: 10px; font-size: 13.5px; border-top: 1px solid var(--line); padding-top: 8px; }
.matrix b { font-family: var(--f-display); font-stretch: 85%; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 14px; }
.two h3 { font-size: 15px; }
.two ul { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; }

.notice { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; color: var(--muted); }
.notice.warn { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.reqs { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 6px; }
.reqs li::before { content: "○ "; color: var(--muted); }
.reqs li.ok::before { content: "● "; color: var(--good); }
.cert { border: 2px solid var(--ink); border-radius: 4px; padding: 22px; position: relative; background: var(--surface); }
.cert::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--line); pointer-events: none; }
.cert h2 { font-size: clamp(22px, 5vw, 32px); font-weight: 800; }
.cert .name { font-family: var(--f-display); font-size: clamp(22px, 5vw, 30px); font-weight: 700; color: var(--accent); margin: 10px 0 4px; }
.ctable { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
.ctable td { border-top: 1px solid var(--line); padding: 5px 4px; }
.ctable td:last-child { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.crumbs { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; }
.foot { font-size: 12px; color: var(--muted); }
.perks { list-style: none; padding: 0; margin: 14px 0 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; font-weight: 600; }
.perks li::before { content: "✓ "; color: var(--accent); }
.next { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 16px 18px; }
.next .eyebrow, .next .hint { color: var(--line); }
.next h2 { font-size: 20px; margin-top: 4px; }
.mod-head { display: flex; gap: 12px; align-items: center; }
.ico { flex: none; width: 46px; height: 46px; border-radius: 8px; background: var(--steel-soft); color: var(--steel); display: grid; place-items: center; }
.ico svg { width: 28px; height: 28px; }
.ico.big { width: 64px; height: 64px; } .ico.big svg { width: 38px; height: 38px; }
.mod-hero { display: flex; gap: 16px; align-items: flex-start; }
.prog { display: flex; align-items: center; gap: 10px; margin-top: auto; }
.prog .meter { flex: 1; }
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.reto-item .code { min-width: 52px; font-size: 13px; }
</style>

<header class="bar">
  <div class="bar-in">
    <button class="brand" data-go="inicio" type="button">Claude para <span>Jefes de Obra</span></button>
    <div class="bar-stats" id="barStats"></div>
  </div>
  <div class="tape"></div>
</header>
<main id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
// ---------- Contenido del programa (28 días) ----------
const CRITERIOS = [
  ["contexto", "Contexto", "Rol, tipo de obra y situación"],
  ["tarea", "Tarea", "Objetivo concreto y entregable"],

const ICONOS = {
  calendario: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h2M11 14h2M15 14h2M7 17h2M11 17h2"/>',
  contrato: '<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 11h7M9 14h7M9 17h4"/>',
  rfi: '<circle cx="8" cy="9" r="3"/><path d="M3 20c0-3 2.5-5 5-5s5 2 5 5"/><path d="M13 4h8v6h-4l-2 2v-2h-2z"/>',
  presupuesto: '<rect x="3" y="9" width="18" height="11" rx="1"/><circle cx="12" cy="14.5" r="2.5"/><path d="M12 2v5M10 4h3a1.5 1.5 0 0 1 0 3"/>',
  seguridad: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8 10l1.5 1.5L12 9M14 10h2M8 15l1.5 1.5L12 14M14 15h2"/>',
  certificado: '<rect x="3" y="4" width="18" height="12" rx="1"/><path d="M7 8h10M7 11h6"/><circle cx="16" cy="16" r="3"/><path d="M14.5 18.5 14 22l2-1 2 1-.5-3.5"/>',
};
const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONOS[k]}</svg>`;

const L = (id, dia, titulo, idea, situacion, datos, tarea) => ({ id, dia, titulo, idea, situacion, datos, tarea });

const MODULOS = [
  { id: 1, dias: "1–5", icono: "calendario", titulo: "Cronogramas de obra",

    practicas: [
      "Dale a Claude duraciones, precedencias y recursos reales: sin ellos el plan será genérico.",

    ],
    lecciones: [
      L("1.1", 1, "Tu primer cronograma con Claude",
        "Convierte una lista de partidas en un cronograma ordenado con fechas.",

        "Pide a Claude un cronograma con fecha de inicio y fin de cada partida, indicando qué partidas pueden ir en paralelo."),
      L("1.2", 1, "Precedencias y ruta crítica",

        "Partida | Duración | Depende de\nA Cimentación | 15 d | —\nB Estructura metálica | 20 d | A\nC Solera | 8 d | A\nD Cubierta | 12 d | B\nE Cerramiento panel | 15 d | B\nF Instalación eléctrica | 18 d | C, D\nG Puertas seccionales | 4 d | E\nH Pintura y señalización | 6 d | F, G",
        "Usa Claude para obtener la ruta crítica, la duración total y la holgura de cada partida no crítica."),
      L("1.3", 2, "Del cronograma a Excel o Project",
        "Pide la salida en un formato que puedas pegar directamente en tus herramientas.",
        "Tienes el cronograma de la lección anterior en texto y quieres pasarlo a tu hoja de cálculo para hacer un diagrama de Gantt.",
        "Columnas que usa tu plantilla: ID, Partida, Inicio (dd/mm/aaaa), Fin, Duración (días), Predecesoras, Responsable.\nInicio de obra: 6 de abril. Festivos: 1 de mayo.",

      L("1.5", 3, "Planificación a 3 semanas",

        "Del cronograma general:\n- Estructura forjado 4: semanas 22-23\n- Fachada plantas 1-2: semanas 21-24\n- Instalaciones PB: semanas 22-26\n- Pedido de ferralla: 5 días de plazo\n- Montacargas llega en la semana 23",
        "Pide a Claude un plan de 3 semanas por tajos con pedidos, recursos y restricciones a resolver antes de cada tarea."),
      L("1.6", 4, "Recuperar un retraso",
        "Busca solapes y refuerzos y compara su coste con la penalización.",

      L("1.8", 5, "Comunicar el plazo a la propiedad",

  { id: 2, dias: "6–10", icono: "contrato", titulo: "Revisión de contratos",

    practicas: [
      "Claude ayuda a leer y resumir, pero no sustituye al asesor jurídico: pide que señale dudas para consultarlas.",

    lecciones: [
      L("2.1", 6, "Resumir un contrato de subcontrata",

MODULOS.forEach(m => m.lecciones.forEach(r => { r.modulo = m; }));
const RETOS = MODULOS.flatMap(m => m.lecciones);
const LECCIONES = RETOS.filter(r => !r.modulo.final);
const FINAL = RETOS.find(r => r.modulo.final);
const APTO_RETO = 60, APTO_FINAL = 70;
const umbral = r => r.modulo.final ? APTO_FINAL : APTO_RETO;

// ---------- Estado ----------
const LS_KEY = "claude-jefes-obra-28d-v1";
let state = { nombre: "", nivel: "Jefe de Obra Junior", retos: {}, actualizado: 0 };
let view = { name: "inicio", modulo: null, reto: null };
let sample = null, sampleChecked = false;
let dbRef = null, dbStatus = "local";
const busy = { run: null, eval: null };
const live = { salida: "" };

function loadLocal() { try { const s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (s && s.retos) state = { ...state, ...s }; } catch (e) {} }
let saveTimer = null;
function save() {
  state.actualizado = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!dbRef) return;
    dbRef.set(JSON.parse(JSON.stringify(state))).then(() => { dbStatus = "cuenta"; })
      .catch(() => { dbRef = null; dbStatus = "local"; });
  }, 800);
}
function retoState(id) { return state.retos[id] || (state.retos[id] = { best: 0, intentos: 0, prompt: "", salida: "", eval: null }); }
const best = id => (state.retos[id] && state.retos[id].best) || 0;
const apta = r => best(r.id) >= umbral(r);

function stats() {
  const aptas = LECCIONES.filter(apta).length;
  const media = Math.round(LECCIONES.reduce((a, r) => a + best(r.id), 0) / LECCIONES.length);
  const siguiente = RETOS.find(r => !apta(r)) || null;
  const finalNota = best(FINAL.id);
  return { aptas, media, siguiente, finalNota, certificado: aptas === LECCIONES.length && finalNota >= APTO_FINAL };
}
const mediaModulo = m => Math.round(m.lecciones.reduce((a, r) => a + best(r.id), 0) / m.lecciones.length);

// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function md(text) {
  try { if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text)); } catch (e) {}
  return "<pre>" + esc(text) + "</pre>";
}

function renderBar() {
  const s = stats();
  $("#barStats").innerHTML = `<span>Lecciones <b>${s.aptas}/${LECCIONES.length}</b></span><span>Final <b>${s.finalNota || "—"}</b></span>`;

function render() {
  renderBar();
  const app = $("#app");
  if (view.name === "inicio") app.innerHTML = vInicio();

  else if (view.name === "reto") app.innerHTML = vReto(view.reto);
  else if (view.name === "certificado") app.innerHTML = vCertificado();
  bindInputs();
}

  <section class="panel">
    <h2>Cómo se evalúa cada prompt</h2>
    <p class="lead" style="margin-top:4px">Seis puntos, de 0 a 5 cada uno. Una lección se aprueba con 60 sobre 100; el proyecto final, con 70.</p>
    <div class="method">${CRITERIOS.map(c => `<div><b>${c[1]}</b>${c[2]}</div>`).join("")}</div>
  </section>
  <section class="panel">
    <div class="row" style="align-items:center">
      <div style="flex:1;min-width:0"><h2>Certificado</h2><p class="lead" style="margin-top:4px">${s.certificado ? "Has completado el programa. Ya puedes descargarlo." : `Llevas ${s.aptas} de ${LECCIONES.length} lecciones aprobadas${s.finalNota ? ` y un ${s.finalNota} en el proyecto final` : ""}.`}</p></div>
      <button class="btn ${s.certificado ? "primary" : ""}" type="button" data-go="certificado">Ver certificado</button>
    </div>
  </section>
  <p class="foot">Tu progreso se guarda ${dbStatus === "cuenta" ? "en tu cuenta" : "en este navegador"}. Es una certificación interna de formación; no sustituye titulaciones ni habilitaciones oficiales.</p>`;
}

function vModulo(id) {
  const m = MODULOS.find(x => x.id === id);
  return `
  <nav class="crumbs"><button class="btn link" type="button" data-go="inicio">Inicio</button><span>›</span><span>${esc(m.titulo)}</span></nav>
  <section class="hero mod-hero"><span class="ico big">${icon(m.icono)}</span><div><div class="eyebrow">Días ${m.dias} · ${m.final ? "Proyecto final" : `${m.lecciones.length} lecciones`}</div><h1>${esc(m.titulo)}</h1><p class="lead">${esc(m.resumen)}</p></div></section>
  <section class="panel"><h2>Buenas prácticas con Claude</h2><ul class="tips">${m.practicas.map(p => `<li>${esc(p)}</li>`).join("")}</ul></section>
  <section class="retos">${m.lecciones.map(r => { const st = state.retos[r.id] || {}; const n = st.best || 0; return `
    <button class="reto-item" type="button" data-go="reto" data-id="${r.id}">
      <span class="code">${m.final ? "Días " + m.dias : "Día " + r.dia}</span>
      <span class="t"><b>${esc(r.titulo)}</b><span>${esc(r.idea)}</span></span>
      <span class="nota" style="color:var(--${n ? (n >= umbral(r) ? "good" : "bad") : "muted"})">${n || "—"}</span>
    </button>`; }).join("")}</section>`;
}

function vecino(id, paso) { const i = RETOS.findIndex(r => r.id === id); return RETOS[i + paso] || null; }

function vReto(id) {
  const r = RETOS.find(x => x.id === id), st = retoState(id), m = r.modulo;
  const salida = busy.run ? live.salida : st.salida;
  const sig = vecino(id, 1), ant = vecino(id, -1);
  const dis = !sample || busy.run || busy.eval ? "disabled" : "";
  return `
  <nav class="crumbs"><button class="btn link" type="button" data-go="inicio">Inicio</button><span>›</span><button class="btn link" type="button" data-go="modulo" data-id="${m.id}">${esc(m.titulo)}</button><span>›</span><span>Lección ${r.id}</span></nav>
  <section class="hero"><div class="eyebrow">${m.final ? `Días ${m.dias} · Proyecto final` : `Día ${r.dia} de 28 · Lección ${r.id}`}</div><h1>${esc(r.titulo)}</h1><p class="lead">${esc(r.idea)}</p></section>
  ${avisoClaude()}
  <section class="panel">
    <h2>Situación</h2>
    <p style="margin:6px 0 0">${esc(r.situacion)}</p>
    <div class="case">${esc(r.datos)}</div>
    <div class="task"><b>Tu tarea:</b> ${esc(r.tarea)}</div>
  </section>
  <section class="panel">
    <div class="row" style="align-items:center"><h2 style="flex:1">Tu prompt</h2><button class="btn" type="button" data-act="insertar">Insertar datos del caso</button></div>
    <p class="hint">Escribe lo que le pedirías a Claude en tu trabajo. Decidir qué datos incluir también cuenta en la nota.${m.final ? " Puedes encadenar varios prompts separándolos con una línea ---." : ""}</p>
    <textarea id="prompt" aria-label="Tu prompt" placeholder="Ej.: Soy jefe de obra de… Te paso estos datos… Necesito… Devuélvemelo en formato…">${esc(st.prompt)}</textarea>
    <div class="btns" style="margin-top:10px">
      <button class="btn steel" type="button" data-act="probar" ${dis}>Probar con Claude</button>
      <button class="btn primary" type="button" data-act="evaluar" ${dis}>Evaluar mi prompt</button>
      ${busy.run || busy.eval ? `<button class="btn" type="button" data-act="parar">Parar</button>` : ""}
    </div>
    <div id="runStatus"></div>
  </section>
  ${salida || busy.run ? `<section class="panel"><h2>Respuesta de Claude</h2><div class="out" id="salida">${salida ? md(salida) : `<div class="status"><span class="dot"></span>Claude está pensando…</div>`}</div><p class="hint" style="margin:8px 0 0">Revisa la respuesta: si no te sirve en obra, mejora el prompt antes de evaluarlo.</p></section>` : ""}
  <section id="evalBox">${busy.eval ? `<div class="panel"><div class="status"><span class="dot"></span>Evaluando tu prompt… puede tardar hasta un minuto.</div></div>` : (st.eval ? vEval(st.eval, st.best, umbral(r)) : "")}</section>
  <nav class="pager">${ant ? `<button class="btn" type="button" data-go="reto" data-id="${ant.id}">← Día ${ant.dia}</button>` : "<span></span>"}${sig ? `<button class="btn ${apta(r) ? "primary" : ""}" type="button" data-go="reto" data-id="${sig.id}">Día ${sig.dia}: ${esc(sig.titulo)} →</button>` : `<button class="btn primary" type="button" data-go="certificado">Ver certificado →</button>`}</nav>`;
}

function vEval(ev, mejor, u) {
  const c = ev.criterios || {};
  return `<div class="panel">
    <div class="eyebrow">Evaluación del último intento</div>
    <div class="score" style="margin-top:6px">
      <span class="big">${ev.nota}</span><span class="stamp ${ev.nota >= u ? "ok" : "ko"}">${ev.nota >= u ? "APTO" : "NO APTO"}</span>
      <span class="hint">Mejor nota: ${mejor} · Se aprueba con ${u}</span>
    </div>
    <div class="crit">${CRITERIOS.map(([k, label]) => { const v = Math.max(0, Math.min(5, Number(c[k]) || 0)); return `<span>${label}</span><span class="meter"><i style="width:${v * 20}%"></i></span><span class="v">${v}/5</span>`; }).join("")}</div>
    <div class="eyebrow" style="margin-top:16px">Impacto en obra</div>
    <div class="matrix">
      <div><b>Plazo</b><span>${esc((ev.impacto || {}).plazo)}</span></div>
      <div><b>Económico</b><span>${esc((ev.impacto || {}).economico)}</span></div>
      <div><b>Habilidades blandas</b><span>${esc((ev.impacto || {}).soft_skills)}</span></div>
    </div>
    <div class="two">
      <div><h3>Lo que has hecho bien</h3><ul>${(ev.fortalezas || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      <div><h3>Qué mejorar</h3><ul>${(ev.mejoras || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
    </div>
    ${ev.prompt_mejorado ? `<div class="eyebrow" style="margin-top:16px">Prompt mejorado de referencia</div><div class="case">${esc(ev.prompt_mejorado)}</div>
    <div class="btns" style="margin-top:8px"><button class="btn" type="button" data-act="usarMejorado">Usar como base</button><button class="btn" type="button" data-act="copiarMejorado">Copiar</button></div>` : ""}
  </div>`;
}

function vCertificado() {
  const s = stats();
  const listo = s.certificado && state.nombre.trim();
  return `
  <nav class="crumbs"><button class="btn link" type="button" data-go="inicio">Inicio</button><span>›</span><span>Certificado</span></nav>
  <section class="panel"><h2>Requisitos</h2><ul class="reqs">
    <li class="${state.nombre.trim() ? "ok" : ""}">Nombre indicado en Inicio</li>
    <li class="${s.aptas === LECCIONES.length ? "ok" : ""}">Las ${LECCIONES.length} lecciones con nota de ${APTO_RETO} o más (${s.aptas}/${LECCIONES.length})</li>
    <li class="${s.finalNota >= APTO_FINAL ? "ok" : ""}">Proyecto final con ${APTO_FINAL} o más (actual: ${s.finalNota || "—"})</li></ul></section>
  <section class="cert">
    <div class="eyebrow">${listo ? "Certificado de formación" : "Vista previa · aún no emitido"}</div>
    <h2 style="margin-top:6px">Claude para Jefes de Obra · Programa de 28 días</h2>
    <div class="name">${esc(state.nombre || "Tu nombre")}</div>
    <div class="hint">${esc(state.nivel)} · ${fechaHoy()} · Código ${codigo()}</div>
    <table class="ctable">${MODULOS.map(m => `<tr><td>Días ${m.dias} · ${esc(m.titulo)}</td><td>${mediaModulo(m)}</td></tr>`).join("")}
    <tr><td><b>Media de las lecciones</b></td><td><b>${s.media}</b></td></tr></table>
  </section>
  <div class="btns"><button class="btn primary" type="button" data-act="descargar" ${listo ? "" : "disabled"}>Descargar certificado (PDF)</button></div>
  <div id="dlStatus" class="hint"></div>`;
}

function codigo() {
  const base = state.nombre.trim().toLowerCase() + "|" + RETOS.map(r => best(r.id)).join(",");
  let h = 2166136261; for (const ch of base) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return "CJO-" + new Date().getFullYear() + "-" + (h >>> 0).toString(36).toUpperCase().padStart(6, "0").slice(0, 6);
}

// ---------- Interacción ----------
function bindInputs() {
  const n = $("#nombre"); if (n) n.addEventListener("input", () => { state.nombre = n.value; save(); });
  const l = $("#nivel"); if (l) l.addEventListener("change", () => { state.nivel = l.value; save(); });
  const p = $("#prompt"); if (p) p.addEventListener("input", () => { retoState(view.reto).prompt = p.value; save(); });
}

document.addEventListener("click", ev => {
  const go = ev.target.closest("[data-go]");
  if (go) {
    if (busy.run || busy.eval) { busy.run && busy.run.abort(); busy.eval && busy.eval.abort(); }
    const g = go.dataset.go;
    view = { name: g, modulo: g === "modulo" ? Number(go.dataset.id) : view.modulo, reto: g === "reto" ? go.dataset.id : view.reto };
    if (g === "reto") view.modulo = RETOS.find(r => r.id === view.reto).modulo.id;
    render(); window.scrollTo(0, 0); return;
  }
  const act = ev.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;
  if (a === "insertar") insertarDatos();
  else if (a === "probar") probar();
  else if (a === "evaluar") evaluar();
  else if (a === "parar") { busy.run && busy.run.abort(); busy.eval && busy.eval.abort(); }
  else if (a === "usarMejorado") { const st = retoState(view.reto); st.prompt = st.eval.prompt_mejorado; save(); render(); }
  else if (a === "copiarMejorado") copiar(retoState(view.reto).eval.prompt_mejorado, act);
  else if (a === "descargar") descargar();
});

function insertarDatos() {
  const r = RETOS.find(x => x.id === view.reto), p = $("#prompt");
  p.value += (p.value.trim() ? "\n\n" : "") + "Datos:\n" + r.datos;
  retoState(r.id).prompt = p.value; save(); p.focus();
}
function copiar(text, btn) {
  navigator.clipboard.writeText(text).then(() => { btn.textContent = "Copiado"; }).catch(() => { btn.textContent = "Selecciona el texto y cópialo"; });
}
function setStatus(html) { const s = $("#runStatus"); if (s) s.innerHTML = html; }

async function probar() {
  const id = view.reto, st = retoState(id), prompt = st.prompt.trim();
  if (!prompt) { setStatus(`<p class="hint">Escribe primero tu prompt.</p>`); return; }
  const ctl = new AbortController(); busy.run = ctl; live.salida = ""; render();
  try {
    const { text, truncated } = await sample(prompt, { signal: ctl.signal, cache: false, onText: ({ text }) => {
      live.salida = text; const o = $("#salida"); if (o && view.reto === id) o.innerHTML = md(text); } });
    st.salida = text.slice(0, 12000); save();
    busy.run = null; if (view.reto === id) render();
    if (truncated) setStatus(`<p class="hint">La respuesta se ha cortado por longitud. Pide algo más acotado.</p>`);
  } catch (e) {
    if (e && e.text) st.salida = e.text.slice(0, 12000);
    busy.run = null; if (view.reto === id) render();
    if (!e || e.code !== "cancelled") setStatus(`<p class="hint" style="color:var(--bad)">${esc(errorText(e))}</p>`);
  }
}

function promptEvaluador(r, st) {
  return `Eres el evaluador del programa "Claude para Jefes de Obra" (edificación y obra civil, España).
Un alumno de nivel "${state.nivel}" ha escrito el prompt que usaría con Claude para resolver una tarea real de obra${r.modulo.final ? " (es el PROYECTO FINAL integrado: valora que cubra todas las partes pedidas; puede contener varios prompts encadenados separados por ---)" : ""}. Evalúa la calidad del PROMPT, no la de la respuesta de la IA, con esta rúbrica de 0 a 5 por criterio. Ajusta la exigencia al nivel: más indulgente con Estudiante y más estricto con Senior. El programa es para personas sin conocimientos de informática: valora la claridad, no la jerga técnica de IA.

- contexto: indica rol, tipo de obra y situación relevante.
- tarea: objetivo concreto y entregable claro.
- datos: incluye los datos del caso necesarios (cifras, hechos) sin omitir los críticos.
- formato: pide una salida usable en obra (tabla, correo, acta, lista, informe), con destinatario y extensión cuando proceda.
- criterio: incorpora criterio profesional: ruta crítica y plazo, margen y contrato, PRL (protección colectiva antes que individual), normativa, y habilidades blandas cuando aplica (asertividad, empatía, liderazgo con respeto, aceptación de críticas, gestión del tiempo).
- control: pide supuestos explícitos o verificación de cálculos, cláusulas y normativa, deja la decisión final al jefe de obra y no expone datos personales innecesarios.

Añade el impacto en obra: una frase sobre cómo el resultado que daría este prompt afectaría al plazo, otra a lo económico y contractual, y otra a las habilidades blandas.

LECCIÓN ${r.id} (${r.modulo.titulo}): ${r.titulo}
Situación: ${r.situacion}
Datos disponibles del caso:
${r.datos}
Tarea encargada al alumno: ${r.tarea}

PROMPT DEL ALUMNO:
"""
${st.prompt.trim().slice(0, 10000)}
"""
${st.salida ? `\nRespuesta que obtuvo de Claude (solo como referencia, extracto):\n"""\n${st.salida.slice(0, 3000)}\n"""\n` : ""}
Responde SOLO con un objeto JSON, en español, con esta forma exacta:
{"criterios":{"contexto":0,"tarea":0,"datos":0,"formato":0,"criterio":0,"control":0},"impacto":{"plazo":"...","economico":"...","soft_skills":"..."},"fortalezas":["..."],"mejoras":["..."],"prompt_mejorado":"..."}
Máximo 3 fortalezas y 3 mejoras, concretas. El prompt_mejorado debe ser un prompt completo y realista que el alumno podría usar en obra.`;
}

async function evaluar() {
  const id = view.reto, r = RETOS.find(x => x.id === id), st = retoState(id);
  if (st.prompt.trim().length < 20) { setStatus(`<p class="hint">Escribe un prompt más completo antes de evaluarlo.</p>`); return; }
  const ctl = new AbortController(); busy.eval = ctl; render();
  try {
    const out = await sample.json(promptEvaluador(r, st), { signal: ctl.signal, cache: false });
    const c = (out && out.criterios) || {};
    const suma = CRITERIOS.reduce((a, [k]) => a + Math.max(0, Math.min(5, Number(c[k]) || 0)), 0);
    const n = Math.round(suma / 30 * 100);
    st.eval = {
      nota: n, criterios: c, impacto: (out && out.impacto) || {},
      fortalezas: Array.isArray(out.fortalezas) ? out.fortalezas.slice(0, 3).map(String) : [],
      mejoras: Array.isArray(out.mejoras) ? out.mejoras.slice(0, 3).map(String) : [],
      prompt_mejorado: typeof out.prompt_mejorado === "string" ? out.prompt_mejorado.slice(0, 6000) : "",
    };
    st.intentos += 1; st.best = Math.max(st.best, n); save();
    busy.eval = null;
    if (view.reto === id) { render(); const box = $("#evalBox"); if (box) box.scrollIntoView({ behavior: "smooth", block: "start" }); }
  } catch (e) {
    busy.eval = null; if (view.reto === id) render();
    if (!e || e.code !== "cancelled") setStatus(`<p class="hint" style="color:var(--bad)">${esc(errorText(e))}</p>`);
  }
}

async function descargar() {
  const out = $("#dlStatus");
  const downloads = window.claude && await window.claude.use("downloads");
  if (!downloads || !window.jspdf) { out.textContent = "La descarga solo está disponible al abrir la página en claude.ai."; return; }
  const { jsPDF } = window.jspdf, s = stats();
  const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
  const W = 297, H = 210;
  doc.setFillColor(40, 91, 119); doc.rect(0, 0, W, 5, "F");
  doc.setFillColor(215, 95, 10); doc.rect(0, 5, W, 1.5, "F");
  doc.setDrawColor(26, 33, 36); doc.setLineWidth(0.8); doc.rect(12, 14, W - 24, H - 26);
  doc.setLineWidth(0.2); doc.rect(15, 17, W - 30, H - 32);
  doc.setTextColor(90, 98, 106); doc.setFont("helvetica", "normal"); doc.setFontSize(11);
  doc.text("CERTIFICADO DE FORMACIÓN · PROGRAMA DE 28 DÍAS", W / 2, 34, { align: "center" });
  doc.setTextColor(26, 33, 36); doc.setFont("helvetica", "bold"); doc.setFontSize(26);
  doc.text("Claude para Jefes de Obra", W / 2, 48, { align: "center" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(12);
  doc.text("Se certifica que", W / 2, 61, { align: "center" });
  doc.setTextColor(215, 95, 10); doc.setFont("helvetica", "bold"); doc.setFontSize(28);
  doc.text(state.nombre.trim(), W / 2, 75, { align: "center" });
  doc.setTextColor(26, 33, 36); doc.setFont("helvetica", "normal"); doc.setFontSize(11);
  doc.text(`ha completado las ${LECCIONES.length} lecciones prácticas y el proyecto final (nivel: ${state.nivel}).`, W / 2, 86, { align: "center" });
  let y = 99; doc.setFontSize(10);
  MODULOS.forEach(m => {
    doc.text(`Días ${m.dias} · ${m.titulo}`, 72, y); doc.text(String(mediaModulo(m)), W - 72, y, { align: "right" });
    doc.setDrawColor(205, 211, 211); doc.line(72, y + 2.5, W - 72, y + 2.5); y += 8.5;
  });
  doc.setFontSize(9); doc.setTextColor(90, 98, 106);
  doc.text(`Fecha: ${fechaHoy()}    Código: ${codigo()}    Media de las lecciones: ${s.media}/100`, W / 2, H - 26, { align: "center" });
  doc.text("Certificación interna de formación. No sustituye titulaciones ni habilitaciones oficiales.", W / 2, H - 20, { align: "center" });
  try {
    await downloads.save({ filename: `Certificado-Claude-Jefes-de-Obra-${state.nombre.trim().replace(/\s+/g, "-")}.pdf`, data: doc.output("arraybuffer") });
    out.textContent = "Certificado descargado.";
  } catch (e) {
    out.textContent = e && e.code === "declined" ? "Has cancelado la descarga." : "No se ha podido descargar el certificado. Inténtalo de nuevo.";
  }
}

// ---------- Arranque ----------
loadLocal();
render();
(async () => {
  if (!window.claude || !window.claude.use) { sampleChecked = true; render(); return; }
  claude.use("sample").then(s => { sample = s; sampleChecked = true; if (!busy.run && !busy.eval) render(); });
  try {
    const [user, db] = await Promise.all([claude.use("user"), claude.use("db")]);
    const uid = user && await user.id();
    if (db && uid) {
      const ref = db.doc("data/users/" + uid + "/progreso28");
      const snap = await ref.get();
      const remote = snap.exists ? snap.data() : null;
      if (remote && remote.retos && (remote.actualizado || 0) > (state.actualizado || 0)) state = { ...state, ...remote };
      dbRef = ref; dbStatus = "cuenta";
      if (!remote || (state.actualizado || 0) > (remote.actualizado || 0)) save();
      if (!busy.run && !busy.eval) render();
    }
  } catch (e) { dbRef = null; dbStatus = "local"; }
})();
</script>
